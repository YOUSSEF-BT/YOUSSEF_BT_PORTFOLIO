name: Add OCI Architect certification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-oci-architect-cert.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add certification
        run: python3 scripts/add_oci_architect_cert.py

      - name: Build portfolio
        run: |
          npm ci
          npm run build

      - name: Commit changes
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add src/pages/CertificationsPage.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add OCI 2026 Architect Associate certification"
            git push origin main
          fi
