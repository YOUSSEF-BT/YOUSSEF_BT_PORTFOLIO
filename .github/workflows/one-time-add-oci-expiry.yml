name: One-time add OCI certification expiry

on:
  push:
    branches: [main]
    paths:
      - "scripts/one_time_add_oci_expiry.py"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded certification patch
        run: python3 scripts/one_time_add_oci_expiry.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Verify production build
        run: npm run build

      - name: Commit certification update
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add src/pages/CertificationsPage.jsx
          git commit -m "Add OCI Architect Associate expiry date"
          git push origin main
