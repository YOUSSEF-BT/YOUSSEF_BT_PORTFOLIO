name: One-time skills compact layout fix

on:
  push:
    branches: [main]
    paths:
      - "scripts/one_time_skills_compact_fix.py"

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded compact layout patch
        run: python3 scripts/one_time_skills_compact_fix.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Verify production build
        run: npm run build

      - name: Commit verified skills layout
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add src/pages/Skills.jsx
          git commit -m "Compact skills page above-the-fold layout"
          git push origin main
