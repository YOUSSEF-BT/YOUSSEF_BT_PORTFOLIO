name: Test FlowForm

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/activate-formsubmit.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send FlowForm test
        run: |
          curl -sS -X POST 'https://flowform.to/bt.youssef.369@gmail.com' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'name=Portfolio setup test' \
            --data-urlencode 'email=bt.youssef.369@gmail.com' \
            --data-urlencode 'message=FlowForm delivery test for Youssef Bouzit portfolio.' \
            --data-urlencode '_subject=Portfolio contact form test' \
            --data-urlencode 'source=https://youssef-bt.github.io/'
