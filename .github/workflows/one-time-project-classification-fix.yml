name: One-time project classification fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-project-classification:
    if: ${{ github.event.head_commit.message == 'Apply guarded project classification fix' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded classification patch
        run: python3 scripts/one_time_project_classification_fix.py

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit verified source changes
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add src/data/projects/index.js src/pages/OpenLegaMaProjectDetail.jsx src/pages/LegacyProjectDetail.jsx
          git commit -m "Align project detail classification with demo domains"
          git push origin main
