name: One-time project classification fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-project-classification:
    if: github.event.head_commit.message == 'Add one-time project classification fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded classification patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('src/data/projects/index.js')
          rich_path = Path('src/pages/OpenLegaMaProjectDetail.jsx')
          legacy_path = Path('src/pages/LegacyProjectDetail.jsx')

          index_text = index_path.read_text()
          rich_text = rich_path.read_text()
          legacy_text = legacy_path.read_text()

          marker = 'const legacyProjectSlugAliases = {'
          if marker not in index_text:
              raise SystemExit('index.js marker not found; aborting safely')

          presentation_block = '''const projectPresentation = {
  "real-time-road-accident-detection": {
    primaryDomain: "Computer Vision",
    projectFocus: ["Deep Learning", "Real-Time Video Analytics", "Road Safety"],
  },
  "openlegama-moroccan-legal-ai": {
    primaryDomain: "GenAI & RAG",
    projectFocus: ["Controlled RAG", "Legal AI", "Multilingual NLP"],
  },
  "8-hybrid-movie-recommender": {
    primaryDomain: "Machine Learning",
    projectFocus: [
      "Recommender Systems",
      "Collaborative Filtering",
      "Content-Based Filtering",
    ],
  },
  "ai-powered-bank-fraud-detection-machine-learning-explainable-ai": {
    primaryDomain: "Machine Learning",
    projectFocus: ["Fraud Detection", "Explainable AI", "Imbalanced Classification"],
  },
  "5-ai-summarizer-2026-03": {
    primaryDomain: "GenAI & RAG",
    projectFocus: ["NLP", "Document Processing", "Text Summarization"],
  },
  "traffic-mvp-image-processing": {
    primaryDomain: "Computer Vision",
    projectFocus: ["Object Detection", "Traffic Analytics", "Real-Time Monitoring"],
  },
  "pulsestream-real-time-social-media-intelligence": {
    primaryDomain: "Machine Learning",
    projectFocus: ["NLP", "Sentiment Analysis", "Big Data Analytics"],
  },
  "customer-churn-mlops-platform": {
    primaryDomain: "MLOps & Data Engineering",
    projectFocus: ["ML Orchestration", "Experiment Tracking", "Model Monitoring"],
  },
  "2-data-quality-monitoring-2025-12": {
    primaryDomain: "MLOps & Data Engineering",
    projectFocus: ["Data Quality", "Observability", "Data Monitoring"],
  },
  "1-customer-analytics-churn-prediction-2025-11": {
    primaryDomain: "Machine Learning",
    projectFocus: ["Predictive Analytics", "Customer Churn", "Business Intelligence"],
  },
};

'''

          if 'const projectPresentation = {' not in index_text:
              index_text = index_text.replace(marker, presentation_block + marker, 1)

          old_get = '''export const getProjectBySlug = (slug) => {
  const canonicalSlug = legacyProjectSlugAliases[slug] ?? slug;
  return projectsData.find((p) => p.slug === canonicalSlug);
};'''
          new_get = '''export const getProjectBySlug = (slug) => {
  const canonicalSlug = legacyProjectSlugAliases[slug] ?? slug;
  const project = projectsData.find((p) => p.slug === canonicalSlug);

  if (!project) return undefined;

  const presentation = projectPresentation[project.slug];
  return presentation ? { ...project, ...presentation } : project;
};'''
          if old_get not in index_text:
              raise SystemExit('getProjectBySlug block not found; aborting safely')
          index_text = index_text.replace(old_get, new_get, 1)

          rich_old = '''            {project.tags?.length > 0 && (
              <div className="glass p-4 md:p-6 rounded-2xl space-y-4 border border-border/50">
                <h3 className="font-bold">Categories</h3>
                <div className="flex flex-wrap gap-2">
                  {project.tags.map((tag) => (
                    <span
                      key={tag}
                      className="px-2 py-1 bg-surface text-xs rounded text-muted-foreground border border-border/50"
                    >
                      {tag}
                    </span>
                  ))}
                </div>
              </div>
            )}'''
          rich_new = '''            {(project.primaryDomain || project.projectFocus?.length > 0) && (
              <div className="glass p-4 md:p-6 rounded-2xl space-y-5 border border-border/50">
                {project.primaryDomain && (
                  <div className="space-y-2">
                    <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground">
                      Primary Domain
                    </h3>
                    <span className="inline-flex px-3 py-1.5 bg-primary/10 text-primary rounded-full text-sm font-semibold border border-primary/30">
                      {project.primaryDomain}
                    </span>
                  </div>
                )}

                {project.projectFocus?.length > 0 && (
                  <div className="space-y-3 pt-4 border-t border-border/50">
                    <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground">
                      Project Focus
                    </h3>
                    <div className="flex flex-wrap gap-2">
                      {project.projectFocus.map((focus) => (
                        <span
                          key={focus}
                          className="px-2.5 py-1 bg-surface text-xs rounded-full text-muted-foreground border border-border/50"
                        >
                          {focus}
                        </span>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}'''
          if rich_old not in rich_text:
              raise SystemExit('Rich detail Categories block not found; aborting safely')
          rich_text = rich_text.replace(rich_old, rich_new, 1)

          legacy_old = '''            {project.tags && (
              <div className="glass p-4 md:p-6 rounded-2xl space-y-4 border border-border/50">
                <h4 className="font-bold">Categories</h4>
                <div className="flex flex-wrap gap-2">
                  {project.tags.map((tag, idx) => (
                    <span
                      key={idx}
                      className="px-1.5 md:px-2 py-1 bg-surface text-xs rounded text-muted-foreground border border-border/50"
                    >
                      {tag}
                    </span>
                  ))}
                </div>
              </div>
            )}'''
          legacy_new = '''            {(project.primaryDomain || project.projectFocus?.length > 0) && (
              <div className="glass p-4 md:p-6 rounded-2xl space-y-5 border border-border/50">
                {project.primaryDomain && (
                  <div className="space-y-2">
                    <h4 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground">
                      Primary Domain
                    </h4>
                    <span className="inline-flex px-3 py-1.5 bg-primary/10 text-primary rounded-full text-sm font-semibold border border-primary/30">
                      {project.primaryDomain}
                    </span>
                  </div>
                )}

                {project.projectFocus?.length > 0 && (
                  <div className="space-y-3 pt-4 border-t border-border/50">
                    <h4 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground">
                      Project Focus
                    </h4>
                    <div className="flex flex-wrap gap-2">
                      {project.projectFocus.map((focus) => (
                        <span
                          key={focus}
                          className="px-2.5 py-1 bg-surface text-xs rounded-full text-muted-foreground border border-border/50"
                        >
                          {focus}
                        </span>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}'''
          if legacy_old not in legacy_text:
              raise SystemExit('Legacy detail Categories block not found; aborting safely')
          legacy_text = legacy_text.replace(legacy_old, legacy_new, 1)

          index_path.write_text(index_text)
          rich_path.write_text(rich_text)
          legacy_path.write_text(legacy_text)
          print('Guarded classification patch applied successfully.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit verified source changes
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add src/data/projects/index.js src/pages/OpenLegaMaProjectDetail.jsx src/pages/LegacyProjectDetail.jsx
          git commit -m "Align project detail classification with demo domains"
          git push origin main
