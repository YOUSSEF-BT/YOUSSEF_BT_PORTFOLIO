<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <script>
      (() => {
        const legacyPrefix = "/Portfolio-Youssef-Bouzit/documents/";
        const documentsPrefix = "/documents/";
        const { pathname, search, hash } = window.location;

        const redirectLegacyAnthropicCertificate = (filename) => {
          const match = filename.match(/^certificate-([a-z0-9]+)-\d+\.pdf$/i);
          if (!match) return false;

          const credentialId = match[1];
          window.location.replace(`https://verify.skilljar.com/c/${credentialId}`);
          return true;
        };

        if (pathname.startsWith(legacyPrefix)) {
          const filename = pathname.slice(legacyPrefix.length);
          if (redirectLegacyAnthropicCertificate(filename)) return;
          window.location.replace(`/documents/${filename}${search}${hash}`);
          return;
        }

        if (pathname.startsWith(documentsPrefix)) {
          const filename = pathname.slice(documentsPrefix.length);
          if (redirectLegacyAnthropicCertificate(filename)) return;
          return;
        }

        // GitHub Pages does not natively serve SPA routes. Preserve the
        // requested clean URL, load the root document, then restore the route
        // in index.html before React Router starts.
        try {
          sessionStorage.setItem(
            "portfolio-spa-route",
            `${pathname}${search}${hash}`
          );
        } catch (e) {}

        window.location.replace("/");
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to the portfolio… <a href="/">Return to portfolio</a>.</p>
  </body>
</html>
