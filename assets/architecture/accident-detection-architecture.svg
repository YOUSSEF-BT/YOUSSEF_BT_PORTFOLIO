<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid Real-Time Accident Detection Architecture</title>
  <desc id="desc">A clean hybrid road-accident detection pipeline using YOLOv11n, BoT-SORT, temporal memory, a fine-tuned YOLOv11s visual branch, an alpha beta gamma behavioral branch, decision fusion, and evidence output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04101f"/><stop offset="0.55" stop-color="#07172b"/><stop offset="1" stop-color="#03101e"/></linearGradient>
    <linearGradient id="cyanPanel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08243a"/><stop offset="1" stop-color="#071b31"/></linearGradient>
    <linearGradient id="redPanel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#251827"/><stop offset="1" stop-color="#170f1b"/></linearGradient>
    <linearGradient id="orangeBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7a1a"/><stop offset="0.55" stop-color="#ff5d28"/><stop offset="1" stop-color="#ff7f19"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#85c6ff" stroke-opacity="0.055" stroke-width="1"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.38"/></filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#58c8ff"/></marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#25ddd2"/></marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ff6f2c"/></marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/><rect width="1600" height="920" fill="url(#grid)"/>
  <text x="800" y="68" text-anchor="middle" fill="#f7fbff" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="850">Hybrid Real-Time Accident Detection Architecture</text>
  <text x="800" y="112" text-anchor="middle" fill="#32cdfa" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">YOLOv11n + BoT-SORT + fine-tuned YOLOv11s + behavioral heuristic αβγ</text>
  <g filter="url(#shadow)">
    <g transform="translate(55 150)"><rect width="280" height="132" rx="22" fill="#0b1e34" stroke="#27cfff" stroke-width="2"/><circle cx="58" cy="66" r="32" fill="#0c2d48" stroke="#2bddff" stroke-width="2"/><path d="M34 61h38l14-13v38L72 73H34z" fill="none" stroke="#6ce8ff" stroke-width="6" stroke-linejoin="round"/><path d="M47 91h22M58 91v18" fill="none" stroke="#6ce8ff" stroke-width="5" stroke-linecap="round"/><text x="110" y="53" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800">Video Input</text><text x="110" y="84" fill="#a4b8ca" font-family="Inter,Arial,sans-serif" font-size="17">CCTV / local video</text></g>
    <g transform="translate(390 150)"><rect width="340" height="132" rx="22" fill="#0b1e34" stroke="#27cfff" stroke-width="2"/><circle cx="57" cy="66" r="32" fill="#0c2d48" stroke="#2bddff" stroke-width="2"/><rect x="35" y="51" width="44" height="28" rx="7" fill="none" stroke="#6ce8ff" stroke-width="5"/><circle cx="45" cy="82" r="5" fill="#6ce8ff"/><circle cx="69" cy="82" r="5" fill="#6ce8ff"/><path d="M43 51l8-12h15l8 12" fill="none" stroke="#6ce8ff" stroke-width="5" stroke-linecap="round"/><text x="105" y="42" fill="#40d8ff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800">OBJECT DETECTION</text><text x="105" y="74" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="850">YOLOv11n</text><text x="105" y="102" fill="#9fb4c8" font-family="Inter,Arial,sans-serif" font-size="15">Cars • motorcycles • buses • trucks</text></g>
    <g transform="translate(790 150)"><rect width="330" height="132" rx="22" fill="#0b1e34" stroke="#27cfff" stroke-width="2"/><circle cx="55" cy="66" r="32" fill="#0c2d48" stroke="#2bddff" stroke-width="2"/><circle cx="38" cy="52" r="5" fill="#6ce8ff"/><circle cx="70" cy="40" r="5" fill="#6ce8ff"/><circle cx="73" cy="75" r="5" fill="#6ce8ff"/><circle cx="41" cy="86" r="5" fill="#6ce8ff"/><path d="M42 52L66 42M70 45L72 70M68 77L45 85M40 81L39 57" fill="none" stroke="#6ce8ff" stroke-width="4"/><text x="104" y="42" fill="#40d8ff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800">MULTI-OBJECT TRACKING</text><text x="104" y="74" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="850">BoT-SORT</text><text x="104" y="102" fill="#9fb4c8" font-family="Inter,Arial,sans-serif" font-size="15">Stable IDs + trajectory history</text></g>
    <g transform="translate(1170 150)"><rect width="370" height="132" rx="22" fill="#0b1e34" stroke="#27cfff" stroke-width="2"/><circle cx="57" cy="66" r="32" fill="#0c2d48" stroke="#2bddff" stroke-width="2"/><path d="M57 42a24 24 0 1 0 22 33" fill="none" stroke="#6ce8ff" stroke-width="5" stroke-linecap="round"/><path d="M57 42v19l13 8" fill="none" stroke="#6ce8ff" stroke-width="5" stroke-linecap="round"/><text x="105" y="42" fill="#40d8ff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800">TEMPORAL MEMORY</text><text x="105" y="74" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="850">90-frame trajectory history</text><text x="105" y="102" fill="#9fb4c8" font-family="Inter,Arial,sans-serif" font-size="13">Position • speed • acceleration • orientation</text></g>
  </g>
  <path d="M335 216H378" fill="none" stroke="#58c8ff" stroke-width="4" marker-end="url(#arrowBlue)"/><path d="M730 216H778" fill="none" stroke="#58c8ff" stroke-width="4" marker-end="url(#arrowBlue)"/><path d="M1120 216H1158" fill="none" stroke="#58c8ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M955 282V322" fill="none" stroke="#58c8ff" stroke-width="4"/><path d="M955 322H385V360" fill="none" stroke="#58c8ff" stroke-width="4" marker-end="url(#arrowBlue)"/><path d="M955 322H1190V360" fill="none" stroke="#58c8ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
