    <g transform="translate(42 148)"><rect width="170" height="56" rx="14" fill="#0c3147" stroke="#1cc3c7" stroke-opacity=".55"/><text x="85" y="22" text-anchor="middle" fill="#a8becd" font-family="Inter,Arial,sans-serif" font-size="14">Precision</text><text x="85" y="47" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="850">86.68%</text></g>
    <g transform="translate(252 148)"><rect width="170" height="56" rx="14" fill="#0c3147" stroke="#1cc3c7" stroke-opacity=".55"/><text x="85" y="22" text-anchor="middle" fill="#a8becd" font-family="Inter,Arial,sans-serif" font-size="14">Recall</text><text x="85" y="47" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="850">91.56%</text></g>
    <g transform="translate(462 148)"><rect width="170" height="56" rx="14" fill="#0c3147" stroke="#1cc3c7" stroke-opacity=".55"/><text x="85" y="22" text-anchor="middle" fill="#a8becd" font-family="Inter,Arial,sans-serif" font-size="14">F1-score</text><text x="85" y="47" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="850">89.06%</text></g>
  </g>
  <g transform="translate(820 365)" filter="url(#shadow)"><rect width="710" height="225" rx="26" fill="url(#redPanel)" stroke="#ff6b38" stroke-width="2"/><circle cx="63" cy="66" r="40" fill="#311c23" stroke="#ff7a28" stroke-width="2"/><circle cx="47" cy="74" r="5" fill="#ffffff"/><circle cx="64" cy="52" r="5" fill="#ffffff"/><circle cx="82" cy="68" r="5" fill="#ffffff"/><path d="M49 71l12-16m7 0l11 10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/><text x="138" y="48" fill="#ff7a45" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="850">BEHAVIORAL ACCIDENT BRANCH</text><text x="138" y="86" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="850">Heuristic α + β + γ</text><text x="138" y="119" fill="#c3aeb6" font-family="Inter,Arial,sans-serif" font-size="18">Temporal anomaly analysis from tracked motion</text>
    <g transform="translate(40 148)"><rect width="192" height="56" rx="14" fill="#42202a" stroke="#ff6f3b" stroke-opacity=".55"/><text x="96" y="22" text-anchor="middle" fill="#f4c2bd" font-family="Inter,Arial,sans-serif" font-size="14">α — Proximity</text><text x="96" y="46" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">Relative distance</text></g>
    <g transform="translate(259 148)"><rect width="192" height="56" rx="14" fill="#42202a" stroke="#ff6f3b" stroke-opacity=".55"/><text x="96" y="22" text-anchor="middle" fill="#f4c2bd" font-family="Inter,Arial,sans-serif" font-size="14">β — Trajectory</text><text x="96" y="46" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">Motion rupture</text></g>
    <g transform="translate(478 148)"><rect width="192" height="56" rx="14" fill="#42202a" stroke="#ff6f3b" stroke-opacity=".55"/><text x="96" y="22" text-anchor="middle" fill="#f4c2bd" font-family="Inter,Arial,sans-serif" font-size="14">γ — Single vehicle</text><text x="96" y="46" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">Abnormal state</text></g>
  </g>
