<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="collabGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="contentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hybridGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc6a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#fff" font-size="28" font-weight="bold" font-family="Arial, sans-serif">
    Hybrid Movie Recommender System
  </text>
  <text x="600" y="80" text-anchor="middle" fill="#aaa" font-size="14" font-family="Arial, sans-serif">
    System Architecture
  </text>

  <!-- User Interface -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="1100" height="100" rx="10" fill="url(#cardGradient)" filter="url(#shadow)"/>
    <text x="550" y="30" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="bold" font-family="Arial, sans-serif">
      User Interface
    </text>

    <rect x="30" y="50" width="200" height="35" rx="5" fill="#1a1a2e" stroke="#00ff88" stroke-width="2"/>
    <text x="130" y="72" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      Movie Search
    </text>

    <rect x="250" y="50" width="200" height="35" rx="5" fill="#1a1a2e" stroke="#00ff88" stroke-width="2"/>
    <text x="350" y="72" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      Recommendations
    </text>

    <rect x="470" y="50" width="200" height="35" rx="5" fill="#1a1a2e" stroke="#00ff88" stroke-width="2"/>
    <text x="570" y="72" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      User Ratings
    </text>

    <rect x="690" y="50" width="200" height="35" rx="5" fill="#1a1a2e" stroke="#00ff88" stroke-width="2"/>
    <text x="790" y="72" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      Personalization
    </text>

    <rect x="910" y="50" width="160" height="35" rx="5" fill="#1a1a2e" stroke="#00ff88" stroke-width="2"/>
    <text x="990" y="72" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      Watchlist
    </text>
  </g>

  <!-- API Layer -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="1100" height="80" rx="10" fill="url(#cardGradient)" filter="url(#shadow)"/>
    <text x="550" y="30" text-anchor="middle" fill="#00d9ff" font-size="16" font-weight="bold" font-family="Arial, sans-serif">
      API Layer
    </text>

    <rect x="30" y="45" width="340" height="25" rx="5" fill="#1a1a2e" stroke="#00d9ff" stroke-width="2"/>
    <text x="200" y="62" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      Recommendation API
    </text>

    <rect x="390" y="45" width="340" height="25" rx="5" fill="#1a1a2e" stroke="#00d9ff" stroke-width="2"/>
    <text x="560" y="62" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      User Profile API
    </text>

    <rect x="750" y="45" width="320" height="25" rx="5" fill="#1a1a2e" stroke="#00d9ff" stroke-width="2"/>
    <text x="910" y="62" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      Movie Data API
    </text>
  </g>

  <!-- Collaborative Filtering -->
  <g transform="translate(50, 360)">
    <rect x="0" y="0" width="350" height="180" rx="10" fill="url(#cardGradient)" filter="url(#shadow)"/>
    <text x="175" y="30" text-anchor="middle" fill="#e94560" font-size="16" font-weight="bold" font-family="Arial, sans-serif">
      Collaborative Filtering
    </text>

    <rect x="20" y="50" width="310" height="35" rx="5" fill="#1a1a2e" stroke="#e94560" stroke-width="2"/>
    <text x="175" y="72" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      User-based CF
    </text>

    <rect x="20" y="95" width="310" height="35" rx="5" fill="#1a1a2e" stroke="#e94560" stroke-width="2"/>
    <text x="175" y="117" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      Item-based CF
    </text>

    <rect x="20" y="140" width="310" height="35" rx="5" fill="#1a1a2e" stroke="#e94560" stroke-width="2"/>
    <text x="175" y="162" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      Matrix Factorization
    </text>
  </g>

  <!-- Content-based Filtering -->
  <g transform="translate(425, 360)">
    <rect x="0" y="0" width="350" height="180" rx="10" fill="url(#cardGradient)" filter="url(#shadow)"/>
    <text x="175" y="30" text-anchor="middle" fill="#9b59b6" font-size="16" font-weight="bold" font-family="Arial, sans-serif">
      Content-based Filtering
    </text>

    <rect x="20" y="50" width="310" height="35" rx="5" fill="#1a1a2e" stroke="#9b59b6" stroke-width="2"/>
    <text x="175" y="72" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      Movie Features
    </text>

    <rect x="20" y="95" width="310" height="35" rx="5" fill="#1a1a2e" stroke="#9b59b6" stroke-width="2"/>
    <text x="175" y="117" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      Genre Analysis
    </text>

    <rect x="20" y="140" width="310" height="35" rx="5" fill="#1a1a2e" stroke="#9b59b6" stroke-width="2"/>
    <text x="175" y="162" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      Similarity Matching
    </text>
  </g>

  <!-- Hybrid Engine -->
  <g transform="translate(800, 360)">
    <rect x="0" y="0" width="350" height="180" rx="10" fill="url(#cardGradient)" filter="url(#shadow)"/>
    <text x="175" y="30" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="bold" font-family="Arial, sans-serif">
      Hybrid Engine
    </text>

    <rect x="20" y="50" width="310" height="35" rx="5" fill="#1a1a2e" stroke="#00ff88" stroke-width="2"/>
    <text x="175" y="72" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      Weighted Ensemble
    </text>

    <rect x="20" y="95" width="310" height="35" rx="5" fill="#1a1a2e" stroke="#00ff88" stroke-width="2"/>
    <text x="175" y="117" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      Switching Strategy
    </text>

    <rect x="20" y="140" width="310" height="35" rx="5" fill="#1a1a2e" stroke="#00ff88" stroke-width="2"/>
    <text x="175" y="162" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      Meta-level Features
    </text>
  </g>

  <!-- User Data -->
  <g transform="translate(50, 570)">
    <rect x="0" y="0" width="350" height="120" rx="10" fill="url(#cardGradient)" filter="url(#shadow)"/>
    <text x="175" y="30" text-anchor="middle" fill="#00d9ff" font-size="16" font-weight="bold" font-family="Arial, sans-serif">
      User Data
    </text>

    <rect x="20" y="50" width="310" height="55" rx="5" fill="#1a1a2e" stroke="#00d9ff" stroke-width="2"/>
    <text x="175" y="72" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      User Profiles & Ratings
    </text>
    <text x="175" y="90" text-anchor="middle" fill="#aaa" font-size="10" font-family="Arial, sans-serif">
      Preferences & History
    </text>
  </g>

  <!-- Movie Database -->
  <g transform="translate(425, 570)">
    <rect x="0" y="0" width="350" height="120" rx="10" fill="url(#cardGradient)" filter="url(#shadow)"/>
    <text x="175" y="30" text-anchor="middle" fill="#00d9ff" font-size="16" font-weight="bold" font-family="Arial, sans-serif">
      Movie Database
    </text>

    <rect x="20" y="50" width="310" height="55" rx="5" fill="#1a1a2e" stroke="#00d9ff" stroke-width="2"/>
    <text x="175" y="72" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      Movie Metadata
    </text>
    <text x="175" y="90" text-anchor="middle" fill="#aaa" font-size="10" font-family="Arial, sans-serif">
      Genres, Directors, Actors
    </text>
  </g>

  <!-- Model Training -->
  <g transform="translate(800, 570)">
    <rect x="0" y="0" width="350" height="120" rx="10" fill="url(#cardGradient)" filter="url(#shadow)"/>
    <text x="175" y="30" text-anchor="middle" fill="#e94560" font-size="16" font-weight="bold" font-family="Arial, sans-serif">
      Model Training
    </text>

    <rect x="20" y="50" width="310" height="55" rx="5" fill="#1a1a2e" stroke="#e94560" stroke-width="2"/>
    <text x="175" y="72" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">
      Offline Training
    </text>
    <text x="175" y="90" text-anchor="middle" fill="#aaa" font-size="10" font-family="Arial, sans-serif">
      Periodic Model Updates
    </text>
  </g>

  <!-- Evaluation -->
  <g transform="translate(50, 720)">
    <rect x="0" y="0" width="350" height="60" rx="10" fill="url(#cardGradient)" filter="url(#shadow)"/>
    <text x="175" y="25" text-anchor="middle" fill="#00ff88" font-size="14" font-weight="bold" font-family="Arial, sans-serif">
      Evaluation
    </text>
    <text x="175" y="45" text-anchor="middle" fill="#aaa" font-size="11" font-family="Arial, sans-serif">
      RMSE, MAE, Precision@K
    </text>
  </g>

  <!-- Deployment -->
  <g transform="translate(425, 720)">
    <rect x="0" y="0" width="350" height="60" rx="10" fill="url(#cardGradient)" filter="url(#shadow)"/>
    <text x="175" y="25" text-anchor="middle" fill="#00ff88" font-size="14" font-weight="bold" font-family="Arial, sans-serif">
      Deployment
    </text>
    <text x="175" y="45" text-anchor="middle" fill="#aaa" font-size="11" font-family="Arial, sans-serif">
      Cloud Platform / Docker
    </text>
  </g>

  <!-- Tech Stack Labels -->
  <g transform="translate(800, 720)">
    <rect x="0" y="0" width="350" height="60" rx="10" fill="url(#cardGradient)" filter="url(#shadow)"/>
    <text x="175" y="25" text-anchor="middle" fill="#00d9ff" font-size="14" font-weight="bold" font-family="Arial, sans-serif">
      Tech Stack
    </text>
    <text x="175" y="45" text-anchor="middle" fill="#aaa" font-size="11" font-family="Arial, sans-serif">
      Python | Scikit-learn | Surprise | Flask
    </text>
  </g>
</svg>