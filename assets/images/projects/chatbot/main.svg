<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="60" y="60" width="1480" height="780" rx="28"/>
    </clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="100" r="260" fill="#7C3AED" fill-opacity="0.10"/>
  <circle cx="120" cy="820" r="280" fill="#0D9488" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    <rect x="40" y="40" width="1520" height="820" rx="34" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <image href="https://raw.githubusercontent.com/YOUSSEF-BT/OpenLegaMa/main/docs/screenshots/home-page.png" x="60" y="60" width="1480" height="780" preserveAspectRatio="xMidYMid slice" clip-path="url(#screenClip)"/>
  </g>
</svg>